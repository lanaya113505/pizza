<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Test Omnibox API</title>
    <style>
        .omnibox-container { position: relative; width: 350px; margin: 50px auto; font-family: Arial, sans-serif; }
        #search-input { width: 100%; padding: 12px; border-radius: 20px; border: 1px solid #ccc; outline: none; box-sizing: border-box; }
        #search-results { position: absolute; width: 100%; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); margin-top: 5px; display: none; z-index: 999; overflow: hidden; }
    </style>
</head>
<body>

<div class="omnibox-container">
    <input type="text" id="search-input" placeholder="Ketik sesuatu...">
    <div id="search-results"></div>
</div>

<script>
    // 1. Definisikan data sumber
    const dataSource = [
        { title: "Google Workspace", description: "Akses layanan cloud", url: "https://google.com" },
        { title: "Chromium Code Search", description: "Eksplorasi source code browser", url: "https://source.chromium.org" },
        { title: "Bug Tracker", description: "Laporan kerentanan sistem", url: "https://crbug.com" },
        { title: "GitHub Repository", description: "Penyimpanan kode sumber", url: "https://github.com" }
    ];

    // 2. Inisialisasi Omnibox API
    const myOmnibox = new OmniboxAPI(
        document.getElementById('search-input'),
        document.getElementById('search-results'),
        {
            suggestions: dataSource,
            onEnter: (selectedItem) => {
                alert(`Anda memilih: ${selectedItem.title}\nURL: ${selectedItem.url}`);
                // Atau lakukan navigasi: window.location.href = selectedItem.url;
            }
        }
    );
</script>

</body>
</html>
