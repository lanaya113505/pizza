<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Kuliah</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; background-color: #f9f9f9; }
        
        #container-utama { display: flex; width: 100vw; height: 100vh; position: relative; }
        
        #iframe-kuliah { width: 50%; height: 100%; border: none; border-right: 1px solid #ddd; }
        
        /* Area Kanan: Textarea untuk menampung drag teks */
        #area-tugas { width: 50%; padding: 30px; box-sizing: border-box; display: flex; flex-direction: column; }
        #area-tugas h2 { margin-top: 0; }
        
        /* Textarea dengan drop zone yang aktif */
        #input-teks { width: 100%; flex-grow: 1; padding: 15px; border: 2px solid #ccc; border-radius: 8px; resize: none; }

        /* --- BOLA BASKET --- */
        #bola-basket {
            position: absolute; font-size: 31px; z-index: 9999; user-select: none; cursor: pointer;
            top: 7px; left: calc(49% - 55px); transition: top 0.4s ease-out;
        }

        /* --- KURSOR KUSTOM (HARUS POINTER-EVENTS: NONE AGAR BISA DROP) --- */
        #custom-cursor {
            position: fixed;
            pointer-events: none; 
            z-index: 100000;
            display: none; 
            font-size: 28px;
            transform: translate(-50%, -50%);
            user-select: none;
        }
    </style>
</head>
<body>

    <div id="container-utama">
        <iframe id="iframe-kuliah" src="https://access.workspace.google.com/u/0/ServiceNotAllowed?application=216932279217&source=scrip&continue=https://chat.google.com"></iframe>

        <div id="area-tugas">
            <h2>Tugas Web</h2>
            <p>1. Sentuh bola, bola turun, tunggu 2 detik kursor berubah.</p>
            <p>2. Tarik (drag) teks dari iframe ke kolom bawah ini:</p>
            <!-- Textarea ini otomatis bisa menerima drag-drop teks standar -->
            <textarea id="input-teks" placeholder="Tarik (drag) teks dari iframe ke sini..."></textarea>
        </div>

        <div id="bola-basket">🏀</div>
        <div id="custom-cursor">🏀</div>
    </div>

    <script>
        const bola = document.getElementById('bola-basket');
        const customCursor = document.getElementById('custom-cursor');
        const textarea = document.getElementById('input-teks');

        // Melacak pergerakan mouse
        document.addEventListener('mousemove', (e) => {
            customCursor.style.left = e.clientX + 'px';
            customCursor.style.top = e.clientY + 'px';
        });

        // Event sentuh bola
        bola.addEventListener('mouseover', () => {
            bola.style.top = '80px';
            bola.style.pointerEvents = 'none';
            
            // Jeda 2 detik (sesuai script Anda)
            setTimeout(() => {
                bola.style.display = 'none';
                customCursor.style.display = 'block';
                document.body.style.cursor = 'none'; 
            }, 2000); 

            // Setelah 4 detik status bola auto (tapi di sini bola sudah display: none)
            setTimeout(() => {
                bola.style.pointerEvents = 'auto';
            }, 4000); 
        }, { once: true });

        // Tambahan: Memastikan textarea selalu bisa menerima drop
        textarea.ondragover = (e) => {
            e.preventDefault(); // Mengizinkan drop
        };
    </script>
</body>
</html>
