<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI OCR Iframe - Tugas Kuliah</title>
    <!-- 1. Import library AI Tesseract.js langsung dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; padding: 20px; 
            background: #1e1e1e; color: white;
            display: flex; flex-direction: column; height: 100vh;
        }
        h2 { text-align: center; color: #4fc3f7; }
        .controls { text-align: center; margin-bottom: 15px; }
        button { 
            padding: 10px 20px; font-size: 16px; 
            background: #2ecc71; color: white; border: none; 
            border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        button:disabled { background: #555; cursor: not-allowed; }
        
        .container { display: flex; gap: 20px; flex: 1; min-height: 0; }
        .panel { background: #2d2d2d; padding: 15px; border-radius: 8px; display: flex; flex-direction: column; }
        .left-panel { flex: 1; max-width: 300px; }
        .right-panel { flex: 2; position: relative; overflow: hidden; }

        textarea { 
            flex: 1; width: 100%; background: #1e1e1e; color: #4fc3f7; 
            border: 2px solid #555; padding: 15px; border-radius: 4px; 
            resize: none; font-size: 16px; margin-top: 10px; box-sizing: border-box;
        }

        iframe { width: 100%; height: 100%; border: none; border-radius: 4px; background: white; }

        #hiddenCanvas, #processCanvas { display: none; }
        
        #ocrStatus { font-size: 12px; color: #aaa; margin-top: 5px; height: 15px;}
        
        /* Kotak merah yang bergerak mengikuti kursor mouse */
        #cursorTracker {
            position: absolute; 
            width: 320px;   
            height: 110px;  
            border: 2px solid #e74c3c; 
            border-radius: 5px;
            pointer-events: none; /* Agar klik tembus ke iframe */
            display: none; 
            background: rgba(231, 76, 60, 0.15);
            z-index: 10;
        }
    </style>
</head>
<body>
    <h2>🌐 AI OCR Iframe Copy (Follow Cursor + Auto-Stop Email)</h2>
    <div class="controls">        
        <button id="startBtn">Mulai Capture Layar & Aktifkan AI</button>
        <div id="ocrStatus"></div>    
    </div>
    
    <div class="container">        
        <div class="panel left-panel">            
            <h3>Hasil OCR AI</h3>            
            <p style="font-size: 12px; color: #aaa; margin: 0">Arahkan kotak merah ke email di pojok kanan atas. Pemindaian otomatis berhenti saat (@) tertangkap.</p>            
            <textarea id="hasil-copy" readonly placeholder="Menunggu AI membaca..."></textarea>        
        </div>
        
        <div class="panel right-panel" id="iframeWrapper">            
            <h3 style="margin-top: 0;">Iframe: webkuliah.com (Web Asli)</h3>                        
            <iframe id="targetIframe" src="https://access.workspace.google.com/u/0/ServiceNotAllowed?application=216932279217&source=scrip&continue=https://chat.google.com"></iframe>                        
            <!-- Kotak penunjuk yang mengikuti kursor -->            
            <div id="cursorTracker"></div>        
        </div>    
    </div>

    <video id="hiddenVideo" autoplay style="display:none;"></video>        
    <canvas id="hiddenCanvas"></canvas>        
    <canvas id="processCanvas" width="320" height="110"></canvas>

    <script>        
        const startBtn = document.getElementById('startBtn');        
        const video = document.getElementById('hiddenVideo');        
        const hiddenCanvas = document.getElementById('hiddenCanvas');        
        const processCanvas = document.getElementById('processCanvas');        
        const outputBox = document.getElementById('hasil-copy');        
        const ocrStatus = document.getElementById('ocrStatus');        
        const iframeWrapper = document.getElementById('iframeWrapper');        
        const cursorTracker = document.getElementById('cursorTracker');

        let localStream = null;        
        let isOcrRunning = false;        
        let scanInterval = null; 
        let isScanningActive = false; // Status apakah scan masih berjalan atau sudah berhenti
        let worker = null;                 

        let lastMouseX = 0;
        let lastMouseY = 0;

        async function loadOcrWorker() {            
            ocrStatus.innerText = "Menginisialisasi AI Tesseract...";            
            worker = await Tesseract.createWorker('eng');            
            ocrStatus.innerText = "AI Siap. Silakan klik tombol 'Mulai Capture'";        
        }        
        loadOcrWorker(); 

        startBtn.addEventListener('click', async () => {            
            try {                
                localStream = await navigator.mediaDevices.getDisplayMedia({                    
                    video: { cursor: "always" },                     
                    audio: false                });

                video.srcObject = localStream;                
                startBtn.disabled = true;                
                startBtn.innerText = "AI Aktif Mengikuti Kursor!";                
                ocrStatus.innerText = "Arahkan kursor ke area email di pojok kanan atas.";                
                
                isScanningActive = true;
                cursorTracker.style.display = 'block';

                startOcrLoop();             
            } catch (err) {                
                console.error("Gagal capture layar: " + err);                
                ocrStatus.innerText = "Gagal: Izin rekam layar ditolak.";            }        });

        // --- FITUR IKUT KURSOR (MOUSEMOVE) ---
        iframeWrapper.addEventListener('mousemove', (e) => {
            if (!isScanningActive) return; // Jika sudah berhenti, kursor tidak menggerakkan kotak lagi

            const rect = iframeWrapper.getBoundingClientRect();
            lastMouseX = e.clientX - rect.left;
            lastMouseY = e.clientY - rect.top;

            // Membuat kursor tepat berada di TENGAH kotak merah (320x110)
            // 320 / 2 = 160 | 110 / 2 = 55
            cursorTracker.style.left = (lastMouseX - 160) + 'px'; 
            cursorTracker.style.top = (lastMouseY - 55) + 'px';  
        });

        iframeWrapper.addEventListener('mouseleave', () => {
            if (isScanningActive) {
                cursorTracker.style.display = 'none';
            }
        });

        iframeWrapper.addEventListener('mouseenter', () => {
            if (isScanningActive) {
                cursorTracker.style.display = 'block';
            }
        });
        // -------------------------------------

        function startOcrLoop() {            
            scanInterval = setInterval(async () => {                
                if (!localStream || isOcrRunning || !isScanningActive) return;                                
                isOcrRunning = true;                
                ocrStatus.innerText = "AI Sedang membaca teks di bawah kursor...";

                hiddenCanvas.width = video.videoWidth;                
                hiddenCanvas.height = video.videoHeight;                
                const ctx = hiddenCanvas.getContext('2d');                
                ctx.drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);

                const baseOffset = 120;                 
                const scaleX = video.videoWidth / window.innerWidth;                
                const scaleY = video.videoHeight / window.innerHeight;                                
                
                // Ambil posisi kotak merah yang sedang mengikuti kursor
                const trackerRect = cursorTracker.getBoundingClientRect();
                const cropX = (trackerRect.left + iframeWrapper.offsetLeft) * scaleX; 
                const cropY = (trackerRect.top + iframeWrapper.offsetTop + baseOffset) * scaleY;                                 
                
                const processCtx = processCanvas.getContext('2d');                
                processCtx.drawImage(hiddenCanvas,                     
                    cropX, cropY, 320 * scaleX, 110 * scaleY, 
                    0, 0, 320, 110                           
                );

                try {                    
                    const result = await worker.recognize(processCanvas);                                        
                    const cleanText = result.data.text.trim().replace(/[\r\n]+/g, ' '); 
                    
                    if (cleanText.length > 2) {                         
                        outputBox.value = cleanText;                    
                        
                        // KONDISI BERHENTI OTOMATIS: Jika teks mengandung '@'
                        if (cleanText.includes('@')) {
                            isScanningActive = false; // Matikan status aktif
                            clearInterval(scanInterval); // Hentikan loop pemindaian
                            
                            localStream.getTracks().forEach(track => track.stop()); // Matikan rekaman layar
                            cursorTracker.style.display = 'none'; // Sembunyikan kotak merah
                            
                            ocrStatus.innerText = "✅ Email terdeteksi! Pemindaian otomatis berhenti.";
                            ocrStatus.style.color = "#2ecc71";
                            startBtn.innerText = "Selesai (Email Ditemukan)";
                            return;
                        }
                    }                    
                    ocrStatus.innerText = "Memindai... Arahkan kursor ke email (@)";                
                } catch (e) {                    
                    console.error("Gagal OCR:", e);                
                }

                isOcrRunning = false;            }, 1000);         
        }    
    </script>
</body>
</html>
