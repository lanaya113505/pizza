<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI OCR Iframe - Tugas Kuliah</title>
    <!-- 1. Import library AI Tesseract.js langsung dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; padding: 20px; 
            background: #1e1e1e; color: white;
            display: flex; flex-direction: column; height: 100vh;
        }
        h2 { text-align: center; color: #4fc3f7; }
        .controls { text-align: center; margin-bottom: 15px; }
        button { 
            padding: 10px 20px; font-size: 16px; 
            background: #2ecc71; color: white; border: none; 
            border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        button:disabled { background: #555; cursor: not-allowed; }
        
        .container { display: flex; gap: 20px; flex: 1; min-height: 0; }
        .panel { background: #2d2d2d; padding: 15px; border-radius: 8px; display: flex; flex-direction: column; }
        .left-panel { flex: 1; max-width: 300px; }
        .right-panel { flex: 2; position: relative; overflow: hidden; }

        textarea { 
            flex: 1; width: 100%; background: #1e1e1e; color: #4fc3f7; 
            border: 2px solid #555; padding: 15px; border-radius: 4px; 
            resize: none; font-size: 16px; margin-top: 10px; box-sizing: border-box;
        }

        /* Iframe standar memuat web aslinya (SOP Aktif) */
        iframe { width: 50%; height: 50%; border: none; border-radius: 1px; background: white; }

        /* Canvas tersembunyi untuk proses cropping gambar */
        #hiddenCanvas, #processCanvas { display: none; }
        
        /* Indikator OCR */
        #ocrStatus { font-size: 12px; color: #aaa; margin-top: 5px; height: 15px;}
        
        /* Lingkaran penunjuk area yang sedang dibaca AI di sekitar kursor */
        #cursorTracker {
            position: absolute; width: 60px; height: 30px;
            border: 2px solid #e74c3c; border-radius: 5px;
            pointer-events: none; /* Klik tembus ke iframe */
            display: none; background: rgba(231, 76, 60, 0.1);
        }
    </style>
</head>
<body>

    <h2>🌐 AI OCR Iframe Copy (Tanpa Proxy)</h2>

    <div class="controls">
        <!-- 2. Tombol untuk memulai perekaman layar -->
        <button id="startBtn">Mulai Capture Layar & Aktifkan AI</button>
        <div id="ocrStatus"></div>
    </div>

    <div class="container">
        <!-- Panel 1websaya.com -->
        <div class="panel left-panel">
            <h3>Hasil OCR AI</h3>
            <p style="font-size: 12px; color: #aaa; margin: 0">Arahkan kursor ke dalam iframe setelah aktif. AI butuh waktu ~1 detik untuk membaca teks di posisi kursor.</p>
            <textarea id="hasil-copy" readonly placeholder="Menunggu AI membaca..."></textarea>
        </div>

        <!-- Panel Iframe Web Asli -->
        <div class="panel right-panel" id="iframeWrapper">
            <h3 style="margin-top: 0;">Iframe: webkuliah.com (Web Asli)</h3>
            
            <!-- Elemen Iframe standar (Cross-Domain) -->
            <iframe id="targetIframe" src="https://access.workspace.google.com/u/0/ServiceNotAllowed?application=216932279217&source=scrip&continue=https://chat.google.com"></iframe>
            
            <!-- Penunjuk area OCR di sekitar kursor -->
            <div id="cursorTracker"></div>
        </div>
    </div>

    <!-- 3. Elemen Video tersembunyi untuk menampung feed rekaman layar -->
    <video id="hiddenVideo" autoplay style="display:none;"></video>
    <!-- Canvas untuk menangkap gambar frame video -->
    <canvas id="hiddenCanvas"></canvas>
    <!-- Canvas untuk cropping area kecil di kursor -->
    <canvas id="processCanvas" width="200" height="60"></canvas>

    <script>
        const startBtn = document.getElementById('startBtn');
        const video = document.getElementById('hiddenVideo');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const processCanvas = document.getElementById('processCanvas');
        const outputBox = document.getElementById('hasil-copy');
        const ocrStatus = document.getElementById('ocrStatus');
        const iframeWrapper = document.getElementById('iframeWrapper');
        const cursorTracker = document.getElementById('cursorTracker');

        let localStream = null;
        let isOcrRunning = false;
        let worker = null; // Tesseract Worker

        // Simpan posisi kursor terakhir
        let lastMouseX = 0;
        let lastMouseY = 0;

        // --- Langkah 1: Inisialisasi Library AI ---
        async function loadOcrWorker() {
            ocrStatus.innerText = "Menginisialisasi AI Tesseract...";
            // Buat worker Tesseract untuk bahasa Inggris ('eng'). Pakai 'ind' untuk Indonesia.
            worker = await Tesseract.createWorker('eng');
            ocrStatus.innerText = "AI Siap. Silakan klik tombol 'Mulai Capture'";
        }
        loadOcrWorker(); // Muat AI saat halaman dibuka

        // --- Langkah 2: Fungsi Memulai Capture Layar (MediaDevices API) ---
        startBtn.addEventListener('click', async () => {
            try {
                // Meminta izin rekam layar kepada pengguna.
                // UNTUK DEMO: Pilih tab "AI OCR Iframe - Tugas Kuliah" di dialog Chrome.
                localStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always" }, // Pastikan kursor ikut direkam
                    audio: false
                });

                video.srcObject = localStream;
                startBtn.disabled = true;
                startBtn.innerText = "AI Aktif. Arahkan kursor!";
                ocrStatus.innerText = "Berhasil merekam layar. Arahkan kursor ke dalam iframe.";
                
                startOcrLoop(); // Mulai loop pembacaan teks
            } catch (err) {
                console.error("Gagal capture layar: " + err);
                ocrStatus.innerText = "Gagal: Izin rekam layar ditolak.";
            }
        });

        // Catat posisi kursor mouse saat bergerak di atas area iframe
        iframeWrapper.addEventListener('mousemove', (e) => {
            // Kita butuh posisi kursor relatif terhadap Iframe
            const rect = iframeWrapper.getBoundingClientRect();
            lastMouseX = e.clientX - rect.left;
            lastMouseY = e.clientY - rect.top;

            // Update penunjuk visual di sekitar kursor
            cursorTracker.style.display = 'block';
            cursorTracker.style.left = (lastMouseX - 30) + 'px'; // Tengah horizontal
            cursorTracker.style.top = (lastMouseY - 15) + 'px';  // Tengah vertikal
        });

        iframeWrapper.addEventListener('mouseleave', () => {
            cursorTracker.style.display = 'none';
        });


        // --- Langkah 3: Loop Utama AI (Proses OCR per detik) ---
        function startOcrLoop() {
            // Jangan jalankan OCR terlalu sering karena berat. Cukup sekali per 700ms - 1 detik.
            setInterval(async () => {
                if (!localStream || isOcrRunning || cursorTracker.style.display === 'none') return;
                
                isOcrRunning = true;
                ocrStatus.innerText = "AI Sedang membaca teks di kursor...";

                // A. Ambil gambar utuh dari feed video layar ke canvas besar
                hiddenCanvas.width = video.videoWidth;
                hiddenCanvas.height = video.videoHeight;
                const ctx = hiddenCanvas.getContext('2d');
                ctx.drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);

                // B. Lakukan Cropping area kecil (200x60 piksel) tepat di posisi kursor
                // PENTING: Karena merekam seluruh tab, kita butuh 'Offset' (jarak tab/address bar).
                // Offset ini bervariasi per OS/Browser. Sesuaikan 'baseOffset' jika tidak pas.
                const baseOffset = 120; // Estimasi tinggi tab + address bar Chrome di Windows
                
                // Hitung koordinat crop berdasarkan posisi kursor dan video
                const scaleX = video.videoWidth / window.innerWidth;
                const scaleY = video.videoHeight / window.innerHeight;
                
                const cropX = (lastMouseX + iframeWrapper.offsetLeft) * scaleX - (100 * scaleX); // Crop tengah horiz
                const cropY = (lastMouseY + iframeWrapper.offsetTop + baseOffset) * scaleY - (30 * scaleY); // Crop tengah vert
                
                const processCtx = processCanvas.getContext('2d');
                // Gambar area yang di-crop ke canvas kecil (untuk dibaca AI)
                processCtx.drawImage(hiddenCanvas, 
                    cropX, cropY, 200 * scaleX, 60 * scaleY, // Ambil dari canvas besar
                    0, 0, 200, 60 // Taruh di canvas kecil
                );

                try {
                    // C. Perintahkan AI membaca teks dari canvas kecil
                    const result = await worker.recognize(processCanvas);
                    
                    // Bersihkan hasil teks (buang simbol aneh)
                    const cleanText = result.data.text.trim().replace(/[\r\n]+/g, ' ');

                    if (cleanText.length > 2) { // Masukkan jika teks terbaca valid
                        outputBox.value = cleanText;
                    }
                    ocrStatus.innerText = "Selesai membaca. Menunggu kursor diam.";
                } catch (e) {
                    console.error("Gagal OCR:", e);
                }

                isOcrRunning = false;
            }, 800); // Interval loop (800 milidetik)
        }
    </script>
</body>
</html>
