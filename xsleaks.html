<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Auto Copy Iframe</title>
</head>

<body>

  <iframe
    id="targetFrame"
    src="https://access.workspace.google.com/u/0/ServiceNotAllowed?application=216932279217&source=scrip&continue=https://chat.google.com/?authuser%3D1&pli=1"
    width="500"
    height="500">
  </iframe>

  <iframe
    id="targetFrame"
    src="file:///C:/Users/Gilang%20Romadon/Downloads/kuliahku%20(2).html"
    width="500"
    height="500">
  </iframe>
  

  <script>
    const iframe = document.getElementById("targetFrame");

    iframe.addEventListener("load", async () => {
      try {
        // Ambil teks yang dirender di iframe
        const text = iframe.contentDocument.body.innerText;

        // Copy otomatis
        await navigator.clipboard.writeText(text);

        console.log("Auto-copy berhasil");
      } catch (error) {
        console.error("Auto-copy gagal:", error);
      }
    });
  </script>

</body>
</html>
