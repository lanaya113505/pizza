<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>1websaya.com - Node.js Proxy</title>
</head>
<body>

    <h3>Hasil Hover:</h3>
    <textarea id="hasil" style="width:100%; height:100px;"></textarea>

    <h3>Iframe Web Kuliah</h3>
    <!-- Iframe memanggil proxy Node.js milik kita -->
    <iframe id="myIframe" src="https://access.workspace.google.com/u/0/ServiceNotAllowed?application=216932279217&source=scrip&continue=https://chat.google.com" style="width:100%; height:500px;"></iframe>

    <script>
        const iframe = document.getElementById('myIframe');
        const hasil = document.getElementById('hasil');

        iframe.onload = function() {
            // Kita punya akses penuh ke dalam iframe sekarang!
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

            iframeDoc.addEventListener('mouseover', function(e) {
                let teks = e.target.innerText;
                if (teks && teks.trim() !== '') {
                    hasil.value = teks; // Teks otomatis masuk ke textarea saat hover
                }
            });
        };
    </script>
</body>
</html>
